services:
  # Optional local graph; Bolt is reachable only on the host loopback interface.
  memgraph:
    image: memgraph/memgraph:3.14.0
    profiles: ["graph"]
    ports:
      - "127.0.0.1:7687:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    command: ["--telemetry-enabled=false", "--storage-snapshot-on-exit=true"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: sovereign
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        BACKEND_EXTRAS: "${BACKEND_EXTRAS:-postgres}"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://sovereign:sovereign@postgres:5432/sovereign"
      SIM_BASE_URL: "http://warehouse-sim:8090"
      SITE_LAYOUT: "${SITE_LAYOUT:-pharma}"
      # Shared with the simulator; every move's permit is signed with it
      PERMIT_SECRET: "${PERMIT_SECRET:?Set PERMIT_SECRET (32+ characters) in .env}"
      CORS_ORIGINS: "http://localhost:3000"
      EXPERIENCE_ANCHOR_PATH: "/anchors/experience.sqlite"
      MEMGRAPH_ENABLED: "${MEMGRAPH_ENABLED:-false}"
      MEMGRAPH_URI: "bolt://memgraph:7687"
      MEMGRAPH_USERNAME: "${MEMGRAPH_USERNAME:-}"
      MEMGRAPH_PASSWORD: "${MEMGRAPH_PASSWORD:-}"
      MEMGRAPH_NAMESPACE: "${MEMGRAPH_NAMESPACE:-sovereign-autonomy}"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - warehouse-sim
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - memory_anchor_data:/anchors
    command: >
      sh -c "python -m app.preflight &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

  # Live warehouse on the benchmark's engine (solid racks, workers, forklift, camera)
  warehouse-sim:
    build:
      context: .
      dockerfile: sim/warehouse_sim/Dockerfile
    ports:
      - "8090:8090"
    environment:
      SIM_TICK_HZ: "10"
      SIM_SEED: "42"
      AUTHORITY_BASE_URL: "http://backend:8080"
      SIM_STATE_DB: "/app/data/controller.db"
      SITE_LAYOUT: "${SITE_LAYOUT:-pharma}"
      PERMIT_SECRET: "${PERMIT_SECRET:?Set PERMIT_SECRET (32+ characters) in .env}"

    volumes:
      - controller_data:/app/data

  # The original demo simulator, kept for comparison: docker compose --profile legacy up mock-sim
  mock-sim:
    build: ./sim/mock_sim
    profiles: ["legacy"]
    ports:
      - "8091:8090"
    environment:
      SIM_TICK_HZ: "10"
    command: >
      uvicorn server:app --host 0.0.0.0 --port 8090

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: >
      sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  memgraph_data:
  postgres_data:
  backend_data:
  controller_data:
  memory_anchor_data:
